name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html
        run: test -f index.html

      - name: Check Day1.js
        run: test -f Day1.js

      - name: CI Success
        run: echo "All CI checks passed successfully!"
